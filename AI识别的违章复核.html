<script>
function styleReviewResult(button, selected) {
 const tone = {'误报':['#d98600','#fff3d9'],'确认违规':['#ef2f4f','#fff4f5'],'计划内事件':['#0879ff','#eef6ff'],'疑似':['#d98600','#fff3d9']}[button.dataset.reviewResult];
 button.style.borderColor = selected ? tone[0] : '#d8e2ef';
 button.style.color = selected ? '#fff' : '#24344d';
 button.style.background = selected ? tone[0] : '#fff';
 button.style.boxShadow = selected ? '0 0 0 2px '+tone[1] : 'none';
}
document.querySelectorAll('[data-review-result]').forEach(button => styleReviewResult(button,button.getAttribute('aria-pressed') === 'true'));
function updateReviewFields(result) {
 const isMisreport = result === '误报';
 const isViolation = result === '确认违规';
 document.getElementById('misreportTypeField').classList.toggle('hidden', !isMisreport);
 document.getElementById('misreportType').required = isMisreport;
 ['reviewEventType','reviewAlarmLevel'].forEach(id => {
  const control = document.getElementById(id);
  control.parentElement.classList.toggle('hidden', !isViolation);
  control.disabled = !isViolation;
  control.required = isViolation && id === 'reviewEventType';
 });
}
document.querySelectorAll('[data-review-result]').forEach(button => {
 button.addEventListener('click', () => {
  document.querySelectorAll('[data-review-result]').forEach(item => {
   const selected = item === button;
   item.setAttribute('aria-pressed', String(selected));
   styleReviewResult(item, selected);
  });
  updateReviewFields(button.dataset.reviewResult);
 });
});
updateReviewFields(document.querySelector('[data-review-result][aria-pressed="true"]').dataset.reviewResult);
</script>

<script src="基础配置规则.js"></script><script src="报警演示数据.js"></script><script src="今日报警演示数据.js"></script><script>
(() => {
 const id = new URLSearchParams(location.search).get('alarmId');
 let extra = []; try { extra = JSON.parse(localStorage.getItem('global-alarm-center-v1'))?.extra || []; } catch {}
 const record = [...extra, ...window.ALARM_DEMO_RECORDS].find(r => r.id === id) || window.ALARM_DEMO_RECORDS[0];
 document.querySelectorAll('[data-alarm-field]').forEach(el => {
 const key = el.dataset.alarmField;
 el.textContent = record[key];
 if(key === 'level') { const colors = {一级:['#ef2f4f','#fff4f5'],二级:['#d98600','#fff3d9'],三级:['#a67c00','#fffbe6'],四级:['#0879ff','#eef6ff']}[record.level]; el.style.cssText = 'font-size:12px;padding:2px 6px;border-radius:4px;color:'+colors[0]+';background:'+colors[1]; }
 if(key === 'overdue' && record.overdue !== '否') el.style.color = '#ef2f4f';
 });
 document.getElementById('alarmPhoto').src = record.photo || 'sample-no-helmet.jpg';
 const eventLabel = document.getElementById('detectionEventLabel');
 function updateDetectionLabel(type) {
  eventLabel.textContent = type;
  document.getElementById('detectionLabelBg').setAttribute('width', Math.min(449, Math.max(110, type.length * 16 + 12)));
 }
 updateDetectionLabel(record.type);

 document.getElementById('reviewEventJudgment').value = record.eventJudgment || '';
 document.getElementById('reviewEventType').value = record.type;
 const levelControl=document.getElementById('reviewAlarmLevel');
 const levelRules=window.AlarmEventLevels;
 levelControl.value=levelRules.level(record.type,record.level,record);
 document.getElementById('reviewEventType').addEventListener('change',event=>{levelControl.value=levelRules.level(event.target.value,record.level,record);});

})();
</script>
<script>document.getElementById('sceneProgress').addEventListener('input',event=>{document.getElementById('sceneCurrentTime').textContent='00:'+String(event.target.value).padStart(2,'0');});</script>
<script>
(() => {
 if(new URLSearchParams(location.search).get('fromMap')==='1')return;
 const submit=[...document.querySelectorAll('button')].find(b=>b.textContent.trim()==='提交复核结果');
 const error=document.createElement('p');error.setAttribute('role','alert');error.style.color='#ef2f4f';submit.parentElement.before(error);
 submit.onclick=()=>{
  error.textContent='';
  try{
   const state=JSON.parse(localStorage.getItem('global-alarm-center-v1'))||{};
   const id=new URLSearchParams(location.search).get('alarmId');
   const base=[...(state.extra||[]),...window.ALARM_DEMO_RECORDS].find(r=>r.id===id)||(!id?window.ALARM_DEMO_RECORDS[0]:null);
   if(!base)throw Error('报警不存在，请返回重新选择');
   if(base.status==='已复核')throw Error('该报警已复核，请返回查看最新状态');
   const result=document.querySelector('[data-review-result][aria-pressed="true"]')?.dataset.reviewResult;
   const misreport=document.getElementById('misreportType');
   if(result==='误报'&&!misreport.value)throw Error('请选择误报类型');
   if(!['确认违规','误报','计划内事件','疑似'].includes(result))throw Error('请选择复核结果');
   if(!confirm('确认提交本次复核结果？'))return;
   const now=new Date();
   const updated={...base,eventJudgment:document.getElementById('reviewEventJudgment').value,status:'已复核',result,type:result==='确认违规'?document.getElementById('reviewEventType').value:base.type,level:result==='确认违规'?document.getElementById('reviewAlarmLevel').value:base.level,reviewer:'张安全',reviewTime:now.toLocaleDateString('sv-SE')+' '+now.toTimeString().slice(0,8),remark:document.querySelector('textarea')?.value.trim()||'',misreportType:result==='误报'?misreport.selectedOptions[0].textContent:''};
   localStorage.setItem('global-alarm-center-v1',JSON.stringify({...state,extra:[updated,...(state.extra||[]).filter(r=>r.id!==base.id)]}));
   location.href='AI隐患核查.html';
  }catch(e){error.textContent=e.message;}
 };
})();
</script>
