(()=>{

Vue.createApp({setup(){
const person='张安全',receipts=ref(read(RK)),disposals=ref(read(DK)),calls=ref(read(CK)),records=ref([]),view=ref('list'),section=ref('tasks'),tab=ref('待接收'),keyword=ref(''),level=ref(null),activeId=ref(''),detailTab=ref('详情'),error=ref(''),preview=ref(null),message=ref(''),now=ref(Date.now()),busy=ref(false),files=ref([]),form=ref({violator:null,description:'',measures:'',evidence:[]});let timer;

function load(){const map=new Map((window.ALARM_DEMO_RECORDS||[]).map(r=>[r.id,r]));const extra=read(AK).extra;if(Array.isArray(extra))extra.forEach(r=>map.set(r.id,r));let data=[...map.values()].filter(r=>AlarmSourceRules.isAI(r)&&r.status==='已复核'&&r.result==='确认违规');if(receipts.value['CASE-DEMO-ACCEPTED']){const source=data.find(r=>r.id.includes('D0006'))||data[0];if(source)data.push({...source,id:'CASE-DEMO-ACCEPTED'});}records.value=data.sort((a,b)=>b.time.localeCompare(a.time));}

const visible=computed(()=>tasks.value.filter(r=>(section.value==='records'?status(r)==='已处置':status(r)!=='已处置'&&(tab.value==='全部'||status(r)===tab.value))&&(!level.value||alarmLevel(r)===level.value)&&(!keyword.value.trim()||[r.id,r.type,r.area,r.device,r.owner].some(v=>String(v||'').includes(keyword.value.trim())))).sort((a,b)=>{if(section.value==='records')return 0;const priority={'待接收':0,'待处置':1};const order=priority[status(a)]-priority[status(b)];if(order)return order;const receivedTime=r=>{const value=ms(receipts.value[r.id]?.time||notificationTime(r));return Number.isFinite(value)?value:0;};return receivedTime(b)-receivedTime(a)||b.id.localeCompare(a.id);}));
const active=computed(()=>records.value.find(r=>r.id===activeId.value));
const receipt=computed(()=>receipts.value[activeId.value]),done=computed(()=>disposals.value[activeId.value]);
const alarmLevel=r=>window.AlarmEventLevels?.level(r.type,r.level,r)||r.level;

function timing(r){const receipt=receipts.value[r.id];if(!receipt)return '已收到报警通知，请及时接收任务';const end=disposals.value[r.id]?.time;const seconds=Math.max(0,Math.floor(((end?ms(end):now.value)-ms(receipt.time))/1000));if(!Number.isFinite(seconds))return '接收时间未记录';return seconds>limit()?'处置超期 '+Math.ceil((seconds-limit())/60)+' 分钟':end?'已按时完成处置':'剩余 '+Math.ceil((limit()-seconds)/60)+' 分钟';}

const doneFor=r=>disposals.value[r.id];
const people=[...new Set([...(window.ALARM_DEMO_RECORDS||[]).map(r=>r.owner),'刘刚'])].filter(Boolean).map((name,i)=>({label:name+'（'+(name==='刘刚'?'13800002001':'1380000'+String(1001+i).padStart(4,'0'))+'）',value:name+'（'+(name==='刘刚'?'13800002001':'1380000'+String(1001+i).padStart(4,'0'))+'）'}));
const processor=r=>disposals.value[r.id]?.person||receipts.value[r.id]?.person||r.assignee||'—';
const phone=r=>disposals.value[r.id]?.phone||receipts.value[r.id]?.phone||r.assigneePhone||people.find(p=>p.label.startsWith(processor(r)+'（'))?.label.match(/（(.*?)）/)?.[1]||'';
  // Dedicated person-linked history fixtures; never add them to the alarm ledger.
  const historyDemo = [];
  [['未佩戴安全帽',8],['违规吸烟',5],['人员入侵',4],['行人未走人行通道',3],['仓库人员未穿反光衣',2],['翻越围栏',2],['未佩戴护目镜',1],['未佩戴安全带',1]].forEach(([type,count],group)=>{
   for(let index=0;index<count;index++){
    const date=new Date();date.setDate(date.getDate()-1-group*4-index);date.setHours(9+index%7,10+group,0,0);
    const time=date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0')+' '+date.toTimeString().slice(0,8);
    historyDemo.push({id:'PERSON-HISTORY-'+group+'-'+index,violator:'刘刚',type,time,area:['仓库作业区','装卸作业区','货架通道'][group%3],status:'已复核',result:'确认违规'});
   }
  });
const history=computed(()=>{if(!form.value.violator)return [];const name=String(form.value.violator).split('（')[0];return [...records.value,...historyDemo].filter(r=>r.id!==activeId.value&&String(disposals.value[r.id]?.violator||r.violator||'').split('（')[0]===name).sort((a,b)=>b.time.localeCompare(a.time));});

function accept(){refresh();const r=active.value;if(!r||!mine(r)||status(r)!=='待接收'){error.value='任务状态已变更，请刷新后查看';return;}if(!confirm('确认接收该报警处置任务？\n接收后开始计算处置时长。'))return;try{receipts.value=persist(RK,r.id,{person,time:stamp()});notify('已接收任务，请及时完成现场处置');}catch{error.value='接收失败，浏览器存储不可用，请重试';}}
function process(){refresh();if(!active.value||!mine(active.value)||!receipt.value||done.value){error.value='任务状态已变更，当前无法处置';return;}const draft=read(FK)[activeId.value];form.value={violator:null,description:'',measures:'',evidence:[],...(draft||{})};files.value=form.value.evidence.map(f=>({id:f.id,name:f.name,status:'finished',url:f.url}));error.value='';view.value='form';window.scrollTo(0,0)}

function upload({file,onFinish,onError}){const f=file.file;if(!f||!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>2*1024*1024){error.value='请选择 JPG、PNG 或 WebP 图片，每张不超过 2MB';onError();return;}if(form.value.evidence.length>=3){error.value='最多上传 3 张处理照片';onError();return;}const reader=new FileReader();reader.onload=()=>{form.value.evidence.push({id:file.id,name:file.name,url:reader.result});error.value='';onFinish();};reader.onerror=()=>{error.value='照片读取失败，请重试';onError();};reader.readAsDataURL(f);}

// Existing static records use the review completion time as the notification handoff time.

const stageTime=value=>value&&value!=='—'?value.replace(' ','\n'):'—';
  const duration=(start,end)=>{
   if(!start||!end)return '—';

  };
  const nodes=computed(()=>{
   const source=active.value;const r=source?{...source,level:alarmLevel(source),...(window.AlarmBasicSettings?window.AlarmBasicSettings.review(source):{})}:null;if(!r)return [];

   const nodes = [
    {title:'AI触发报警',time:r.time,fields:[['报警ID',r.id],['违规事件类型',r.type],['报警等级',r.level],['设备名称',r.device],['责任区域',r.area]],photos:[{url:r.photo,name:'报警现场照片'}]},
