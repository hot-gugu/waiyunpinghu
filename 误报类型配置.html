<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>误报类型配置 - AI智能报警处置平台</title><link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 "Microsoft YaHei",sans-serif;color:#24344d;background:#f5f7fa}.workspace{height:100%;display:flex;flex-direction:column;min-height:0}.page-head{height:60px;background:white;padding:18px 24px;border-bottom:1px solid #e7eef8;flex:none}.content{padding:24px;overflow:auto;flex:1;min-height:0}.card{background:linear-gradient(145deg,#fff,#f7fbff);border:1px solid rgba(190,211,238,.95);border-radius:8px;box-shadow:0 8px 20px rgba(45,87,140,.06)}.toolbar{display:flex;align-items:center;gap:12px;padding:16px}.toolbar input{width:300px}.count{margin-left:auto;color:#8190a5}button,input,textarea{font:inherit;font-weight:400}button{cursor:pointer;height:36px;border-radius:8px;padding:0 16px;border:1px solid #d8e2ef;background:white;color:#24344d}input,textarea{border:1px solid #d8e2ef;border-radius:8px;padding:8px 12px;color:#24344d}input{height:36px}input:focus,textarea:focus{outline:1px solid #a9c9ff}.primary{border:0;background:linear-gradient(100deg,#0879ff,#6654f7);color:white}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px 20px;border-bottom:1px solid #e7eef8;font-weight:400}th{color:#526b91;background:#f7fbff;border-bottom-color:#dce8f7}.action{height:30px;border-radius:6px;background:#eef6ff;color:#0879ff;border-color:#cfe1ff;padding:0 12px;margin-right:8px}.danger{color:#ef2f4f;background:#fff4f5;border-color:#ef2f4f}dialog{width:480px;max-width:95vw;border:1px solid rgba(190,211,238,.95);border-radius:8px;padding:24px;color:#24344d}dialog::backdrop{background:rgba(23,32,51,.35)}h2{font-size:16px;font-weight:400;margin:0 0 24px}label{display:block;margin:16px 0 6px}dialog input,dialog textarea{width:100%}.footer{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}.error{color:#ef2f4f;font-size:12px;min-height:18px;margin-top:8px}.required{color:#ef2f4f}.empty{padding:48px;text-align:center;color:#8190a5}
</style></head><body><div class="workspace"><header class="page-head">参数配置 / 误报类型配置</header><main class="content"><section class="card"><div class="toolbar"><input id="search" placeholder="搜索误报类型名称或说明" aria-label="搜索误报类型"><button class="primary" id="add">新增误报类型</button><span class="count" id="count"></span></div><div class="table-wrap"><table><thead><tr><th style="width:100px">序号</th><th style="width:240px">误报类型</th><th>说明</th><th style="width:200px">操作</th></tr></thead><tbody id="rows"></tbody></table></div></section><p id="pageError" class="error" role="alert"></p></main></div>
